<style>
:root{
  --blue:#0b6ff5;
  --blue-bright:#2f91ff;
  --blue-dark:#0755c7;
  --navy:#0b1f3a;
  --muted:#5d6d82;
  --line:rgba(11,111,245,.14);
  --surface:rgba(255,255,255,.93);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{
  min-height:100svh;
  position:relative;
  isolation:isolate;
  overflow-x:hidden;
  color:var(--navy);
  background:#0b1f3a;
}
body::before,
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
}
body::before{
  z-index:-2;
  inset:-10px;
  background:
    linear-gradient(145deg,rgba(4,18,38,.30),rgba(5,42,85,.22)),
    url("/assets/showroom-background-v1.svg") center/cover no-repeat;
  filter:saturate(.88) contrast(.96) blur(1.6px);
  transform:scale(1.015);
}
body::after{
  z-index:-1;
  background:
    linear-gradient(180deg,rgba(5,20,41,.20),rgba(5,24,50,.38)),
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.05),rgba(3,20,43,.16) 72%);
}
main{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:max(26px,env(safe-area-inset-top)) 20px max(30px,env(safe-area-inset-bottom));
}
.entry{
  width:min(520px,100%);
  padding:30px clamp(18px,5vw,38px) 26px;
  text-align:center;
  background:var(--surface);
  border:1px solid rgba(255,255,255,.92);
  border-radius:32px;
  box-shadow:
    0 30px 80px rgba(2,19,40,.34),
    inset 0 0 0 1px var(--line);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.assistant-mark{
  position:relative;
  width:108px;
  height:108px;
  margin:0 auto 18px;
  display:grid;
  place-items:center;
  border-radius:31px;
  color:#fff;
  background:linear-gradient(145deg,var(--blue-bright),var(--blue) 58%,var(--blue-dark));
  box-shadow:
    0 18px 34px rgba(8,91,205,.27),
    inset 0 1px 1px rgba(255,255,255,.42);
  transform:rotate(-2deg);
  animation:gentleFloat 4.5s ease-in-out infinite;
}
.assistant-mark::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:25px;
}
.assistant-mark svg{
  width:64px;
  height:64px;
  transform:rotate(2deg);
}
.status-dot{
  position:absolute;
  right:-4px;
  bottom:7px;
  width:26px;
  height:26px;
  border:5px solid #fff;
  border-radius:50%;
  background:#1fc879;
  box-shadow:0 5px 12px rgba(25,139,89,.24);
}
.identity{
  width:max-content;
  max-width:100%;
  margin:0 auto 18px;
  padding:8px 13px;
  color:var(--blue);
  background:rgba(11,111,245,.08);
  border:1px solid rgba(11,111,245,.12);
  border-radius:999px;
  font-size:14px;
  font-weight:800;
  letter-spacing:.01em;
}
.identity strong{color:var(--navy)}
h1{
  margin:0;
  font-size:clamp(36px,9vw,54px);
  line-height:1.02;
  letter-spacing:-.048em;
  font-weight:900;
  text-wrap:balance;
}
.intro{
  max-width:410px;
  margin:18px auto 0;
  color:var(--muted);
  font-size:17px;
  line-height:1.48;
  font-weight:500;
  text-wrap:balance;
}
.quick-points{
  margin:22px 0 0;
  padding:0;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  list-style:none;
}
.quick-points li{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 10px;
  color:#34506f;
  background:#f7faff;
  border:1px solid #dfeafb;
  border-radius:999px;
  font-size:13px;
  font-weight:750;
  white-space:nowrap;
}
.quick-points svg{
  width:15px;
  height:15px;
  color:var(--blue);
}
button{
  width:100%;
  min-height:68px;
  margin-top:24px;
  padding:16px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  border:0;
  border-radius:20px;
  color:#fff;
  background:linear-gradient(135deg,#208cff,var(--blue) 52%,var(--blue-dark));
  box-shadow:0 16px 30px rgba(8,91,205,.27);
  font:inherit;
  font-size:21px;
  font-weight:900;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
}
button svg{
  width:22px;
  height:22px;
  transition:transform .18s ease;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 20px 36px rgba(8,91,205,.33);
}
button:hover svg{transform:translateX(3px)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:4px solid rgba(11,111,245,.22);outline-offset:5px}
button:disabled{opacity:.72;cursor:wait;transform:none}
.helper{
  margin:13px 0 0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:#708096;
  font-size:13px;
  font-weight:650;
}
.helper svg{width:15px;height:15px}
@keyframes gentleFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-5px) rotate(-2deg)}
}
@media(max-width:430px){
  body::before{background-position:31% center}
  main{padding-left:14px;padding-right:14px}
  .entry{padding:24px 18px 22px;border-radius:28px}
  .assistant-mark{width:94px;height:94px;border-radius:28px;margin-bottom:16px}
  .assistant-mark::before{border-radius:22px}
  .assistant-mark svg{width:56px;height:56px}
  .identity{margin-bottom:15px}
  h1{font-size:clamp(34px,10.5vw,45px)}
  .intro{font-size:16px}
  .quick-points{gap:7px;margin-top:19px}
  .quick-points li{font-size:12px;padding:7px 9px}
  button{min-height:64px;margin-top:21px;font-size:20px}
}
@media(max-height:720px){
  .entry{padding-top:20px;padding-bottom:19px}
  .assistant-mark{width:82px;height:82px;margin-bottom:13px;border-radius:24px}
  .assistant-mark::before{border-radius:18px}
  .assistant-mark svg{width:48px;height:48px}
  .identity{margin-bottom:12px;padding:6px 11px}
  h1{font-size:clamp(32px,8vw,43px)}
  .intro{margin-top:12px;font-size:15px}
  .quick-points{margin-top:15px}
  button{min-height:58px;margin-top:18px}
  .helper{margin-top:10px}
}
@media(prefers-reduced-motion:reduce){
  .assistant-mark{animation:none}
  button,button svg{transition:none}
}
</style>
</head>
<body>
<main>
  <section class="entry" aria-labelledby="welcomeTitle">
    <div class="assistant-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M13 36.5h38l-3.6-10.1a6 6 0 0 0-5.7-4H22.3a6 6 0 0 0-5.7 4L13 36.5Z" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M10 36.5h44v9a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4v-9Z" fill="rgba(255,255,255,.18)" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M19 50v3M45 50v3" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="19" cy="42" r="2.5" fill="currentColor"/>
        <circle cx="45" cy="42" r="2.5" fill="currentColor"/>
        <path d="M25 43h14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M16 31h-4M48 31h4" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <span class="status-dot"></span>
    </div>

    <p class="identity">Assistente do <strong>Carlos</strong></p>
    <h1 id="welcomeTitle">Vamos dar seguimento ao seu pedido</h1>
    <p class="intro">Encontre a viatura certa, simule o financiamento ou envie os dados da sua retoma — tudo em poucos passos.</p>

    <ul class="quick-points" aria-label="Serviços disponíveis">
      <li>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 10 3 3 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Stock atualizado
      </li>
      <li>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 10 3 3 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Retoma
      </li>
      <li>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 10 3 3 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Financiamento
      </li>
    </ul>

    <button id="startAssistant" type="button">
      <span>Continuar</span>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="helper">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5 16 5v4.6c0 3.7-2.5 6.5-6 7.9-3.5-1.4-6-4.2-6-7.9V5l6-2.5Z" stroke="currentColor" stroke-width="1.7"/><path d="m7.3 10 1.7 1.7 3.7-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Rápido, simples e sem compromisso
    </p>
  </section>
</main>
<script>
const button=document.getElementById('startAssistant');
button.addEventListener('click',()=>{
  button.disabled=true;
  button.textContent='A abrir…';
  window.location.assign('/assistant.html');
});
</script>
</body>
</html>
