<html lang="pt-PT">
<head>
<meta charset="utf-8">

<meta name="twitter:title" content="Vamos dar seguimento ao seu pedido">

<style>
:root{
  --blue:#0b6ff5;
  --blue-bright:#2f91ff;
  --blue-dark:#0755c7;
  --navy:#0b1f3a;
  --muted:#5d6d82;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{
  min-height:100svh;
  position:relative;
  isolation:isolate;
  overflow-x:hidden;
  color:var(--navy);
  background:#0b1f3a;
}
body::before,
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
}
body::before{
  z-index:-2;
  inset:-8px;
  background:
    linear-gradient(145deg,rgba(4,18,38,.25),rgba(5,42,85,.16)),
    url("/assets/showroom-background-v1.svg") center/cover no-repeat;
  filter:saturate(.92) contrast(.98) blur(1px);
  transform:scale(1.012);
}
body::after{
  z-index:-1;
  background:
    linear-gradient(180deg,rgba(5,20,41,.14),rgba(5,24,50,.28)),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.04),rgba(3,20,43,.10) 74%);
}
main{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:max(18px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));
}
.entry{
  width:min(430px,calc(100vw - 28px));
  padding:23px 24px 20px;
  text-align:center;
  background:rgba(255,255,255,.86);
  border:1px solid rgba(255,255,255,.78);
  border-radius:28px;
  box-shadow:0 24px 64px rgba(2,19,40,.30);
  backdrop-filter:blur(17px);
  -webkit-backdrop-filter:blur(17px);
}
.assistant-mark{
  position:relative;
  width:76px;
  height:76px;
  margin:0 auto 13px;
  display:grid;
  place-items:center;
  border-radius:23px;
  color:#fff;
  background:linear-gradient(145deg,var(--blue-bright),var(--blue) 58%,var(--blue-dark));
  box-shadow:0 13px 25px rgba(8,91,205,.25),inset 0 1px 1px rgba(255,255,255,.40);
}
.assistant-mark::before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid rgba(255,255,255,.24);
  border-radius:18px;
}
.assistant-mark svg{width:45px;height:45px}
.status-dot{
  position:absolute;
  right:-3px;
  bottom:5px;
  width:20px;
  height:20px;
  border:4px solid #fff;
  border-radius:50%;
  background:#1fc879;
}
.identity{
  width:max-content;
  max-width:100%;
  margin:0 auto 13px;
  padding:6px 11px;
  color:var(--blue);
  background:rgba(11,111,245,.08);
  border:1px solid rgba(11,111,245,.12);
  border-radius:999px;
  font-size:13px;
  font-weight:800;
}
.identity strong{color:var(--navy)}
h1{
  max-width:380px;
  margin:0 auto;
  font-size:clamp(32px,8.6vw,43px);
  line-height:1.02;
  letter-spacing:-.045em;
  font-weight:900;
  text-wrap:balance;
}
.intro{
  max-width:340px;
  margin:13px auto 0;
  color:var(--muted);
  font-size:15.5px;
  line-height:1.42;
  font-weight:550;
  text-wrap:balance;
}
.services{
  margin:14px 0 0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:5px 9px;
  color:#34506f;
  font-size:12.5px;
  line-height:1.3;
  font-weight:750;
}
.services i{
  color:var(--blue);
  font-style:normal;
}
button{
  width:100%;
  min-height:58px;
  margin-top:18px;
  padding:13px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  border:0;
  border-radius:17px;
  color:#fff;
  background:linear-gradient(135deg,#208cff,var(--blue) 52%,var(--blue-dark));
  box-shadow:0 13px 25px rgba(8,91,205,.25);
  font:inherit;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
}
button svg{width:20px;height:20px;transition:transform .18s ease}
button:hover{transform:translateY(-2px);box-shadow:0 17px 31px rgba(8,91,205,.31)}
button:hover svg{transform:translateX(3px)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:4px solid rgba(11,111,245,.25);outline-offset:4px}
button:disabled{opacity:.72;cursor:wait;transform:none}
.helper{
  margin:10px 0 0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:#708096;
  font-size:12px;
  font-weight:650;
}
.helper svg{width:14px;height:14px}
@media(max-width:430px){
  body::before{background-position:31% center}
  .entry{padding:20px 18px 18px;border-radius:25px}
  h1{font-size:clamp(31px,9.2vw,39px)}
}
@media(max-height:700px){
  main{padding-top:12px;padding-bottom:12px}
  .entry{padding-top:16px;padding-bottom:15px}
  .assistant-mark{width:64px;height:64px;margin-bottom:10px;border-radius:20px}
  .assistant-mark::before{border-radius:15px}
  .assistant-mark svg{width:38px;height:38px}
  .identity{margin-bottom:10px;padding:5px 10px}
  h1{font-size:31px}
  .intro{margin-top:10px;font-size:14.5px}
  .services{margin-top:10px}
  button{min-height:54px;margin-top:14px}
  .helper{margin-top:8px}
}
@media(prefers-reduced-motion:reduce){
  button,button svg{transition:none}
}
</style>
</head>
<body>
<main>
  <section class="entry" aria-labelledby="welcomeTitle">
    <div class="assistant-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M13 36.5h38l-3.6-10.1a6 6 0 0 0-5.7-4H22.3a6 6 0 0 0-5.7 4L13 36.5Z" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M10 36.5h44v9a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4v-9Z" fill="rgba(255,255,255,.18)" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M19 50v3M45 50v3" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="19" cy="42" r="2.5" fill="currentColor"/>
        <circle cx="45" cy="42" r="2.5" fill="currentColor"/>
        <path d="M25 43h14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M16 31h-4M48 31h4" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <span class="status-dot"></span>
    </div>

    <p class="identity">Assistente do <strong>Carlos</strong></p>
    <h1 id="welcomeTitle">Vamos dar seguimento ao seu pedido</h1>
    <p class="intro">Stock, financiamento e retoma — tudo em poucos passos.</p>

    <p class="services">
      <span>Stock atualizado</span><i>•</i><span>Retoma</span><i>•</i><span>Financiamento</span>
    </p>

    <button id="startAssistant" type="button">
      <span>Continuar</span>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="helper">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5 16 5v4.6c0 3.7-2.5 6.5-6 7.9-3.5-1.4-6-4.2-6-7.9V5l6-2.5Z" stroke="currentColor" stroke-width="1.7"/><path d="m7.3 10 1.7 1.7 3.7-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Rápido, simples e sem compromisso
    </p>
  </section>
</main>
<script>
const button=document.getElementById('startAssistant');
button.addEventListener('click',()=>{
  button.disabled=true;
  button.textContent='A abrir…';
  window.location.assign('/assistant.html');
});
</script>
</body>
</html>
