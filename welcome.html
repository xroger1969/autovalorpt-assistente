<style>
:root{
  --blue:#0b6ff5;
  --blue-bright:#2f91ff;
  --blue-dark:#0755c7;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{
  min-height:100svh;
  position:relative;
  isolation:isolate;
  overflow-x:hidden;
  color:#fff;
  background:#081a31;
}
body::before,
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
}
body::before{
  z-index:-2;
  background:url("/assets/showroom-background-v1.svg") center/cover no-repeat;
  filter:saturate(.98) contrast(1.01);
}
body::after{
  z-index:-1;
  background:
    linear-gradient(180deg,rgba(4,15,31,.22) 0%,rgba(5,22,45,.28) 58%,rgba(3,17,36,.42) 100%),
    radial-gradient(circle at 50% 46%,rgba(11,52,96,.02),rgba(2,14,30,.10) 78%);
}
main{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:max(28px,env(safe-area-inset-top)) 22px max(30px,env(safe-area-inset-bottom));
}
.entry{
  width:min(520px,100%);
  text-align:center;
}
.assistant-mark{
  position:relative;
  width:82px;
  height:82px;
  margin:0 auto 17px;
  display:grid;
  place-items:center;
  border-radius:25px;
  color:#fff;
  background:linear-gradient(145deg,var(--blue-bright),var(--blue) 58%,var(--blue-dark));
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 16px 34px rgba(2,16,34,.34),inset 0 1px 1px rgba(255,255,255,.42);
}
.assistant-mark::before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid rgba(255,255,255,.23);
  border-radius:19px;
}
.assistant-mark svg{width:48px;height:48px}
.status-dot{
  position:absolute;
  right:-3px;
  bottom:6px;
  width:21px;
  height:21px;
  border:4px solid #fff;
  border-radius:50%;
  background:#1fc879;
}
.identity{
  width:max-content;
  max-width:100%;
  margin:0 auto 18px;
  padding:7px 12px;
  color:#fff;
  background:rgba(4,22,45,.34);
  border:1px solid rgba(255,255,255,.28);
  border-radius:999px;
  box-shadow:0 8px 24px rgba(2,14,30,.12);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-size:14px;
  font-weight:750;
}
.identity strong{font-weight:900}
h1{
  max-width:500px;
  margin:0 auto;
  font-size:clamp(40px,10vw,58px);
  line-height:1.01;
  letter-spacing:-.05em;
  font-weight:900;
  text-wrap:balance;
  text-shadow:0 4px 22px rgba(0,8,20,.55);
}
.intro{
  max-width:390px;
  margin:17px auto 0;
  color:rgba(255,255,255,.88);
  font-size:17px;
  line-height:1.45;
  font-weight:600;
  text-wrap:balance;
  text-shadow:0 3px 14px rgba(0,8,20,.62);
}
button{
  width:min(360px,100%);
  min-height:64px;
  margin-top:28px;
  padding:15px 22px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:19px;
  color:#fff;
  background:linear-gradient(135deg,#208cff,var(--blue) 52%,var(--blue-dark));
  box-shadow:0 16px 34px rgba(2,22,55,.38);
  font:inherit;
  font-size:21px;
  font-weight:900;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
}
button svg{width:21px;height:21px;transition:transform .18s ease}
button:hover{transform:translateY(-2px);box-shadow:0 20px 40px rgba(2,22,55,.46)}
button:hover svg{transform:translateX(3px)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:4px solid rgba(255,255,255,.35);outline-offset:5px}
button:disabled{opacity:.72;cursor:wait;transform:none}
.helper{
  margin:13px 0 0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:rgba(255,255,255,.76);
  font-size:13px;
  font-weight:650;
  text-shadow:0 2px 10px rgba(0,8,20,.58);
}
.helper svg{width:15px;height:15px}
@media(max-width:600px){
  body::before{
    background-image:url("/assets/showroom-sports-mobile-v2.svg");
    background-position:center;
  }
}
@media(max-width:430px){
  main{padding-left:18px;padding-right:18px}
  .assistant-mark{width:74px;height:74px;margin-bottom:15px;border-radius:23px}
  .assistant-mark::before{border-radius:17px}
  .assistant-mark svg{width:44px;height:44px}
  .identity{margin-bottom:16px}
  h1{font-size:clamp(38px,11vw,47px)}
  .intro{font-size:16px}
  button{min-height:61px;margin-top:25px;font-size:20px}
}
@media(max-height:700px){
  main{padding-top:16px;padding-bottom:16px}
  .assistant-mark{width:64px;height:64px;margin-bottom:11px}
  .assistant-mark svg{width:38px;height:38px}
  .identity{margin-bottom:12px;padding-top:5px;padding-bottom:5px}
  h1{font-size:36px}
  .intro{margin-top:12px;font-size:15px}
  button{min-height:56px;margin-top:19px}
  .helper{margin-top:9px}
}
@media(prefers-reduced-motion:reduce){
  button,button svg{transition:none}
}
</style>
</head>
<body>
<main>
  <section class="entry" aria-labelledby="welcomeTitle">
    <div class="assistant-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M13 36.5h38l-3.6-10.1a6 6 0 0 0-5.7-4H22.3a6 6 0 0 0-5.7 4L13 36.5Z" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M10 36.5h44v9a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4v-9Z" fill="rgba(255,255,255,.18)" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M19 50v3M45 50v3" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="19" cy="42" r="2.5" fill="currentColor"/>
        <circle cx="45" cy="42" r="2.5" fill="currentColor"/>
        <path d="M25 43h14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M16 31h-4M48 31h4" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      </svg>
      <span class="status-dot"></span>
    </div>

    <p class="identity">Assistente do <strong>Carlos</strong></p>
    <h1 id="welcomeTitle">Vamos dar seguimento ao seu pedido</h1>
    <p class="intro">Stock, financiamento e retoma — tudo em poucos passos.</p>

    <button id="startAssistant" type="button">
      <span>Continuar</span>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="helper">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5 16 5v4.6c0 3.7-2.5 6.5-6 7.9-3.5-1.4-6-4.2-6-7.9V5l6-2.5Z" stroke="currentColor" stroke-width="1.7"/><path d="m7.3 10 1.7 1.7 3.7-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Rápido, simples e sem compromisso
    </p>
  </section>
</main>
<script>
const button=document.getElementById('startAssistant');
button.addEventListener('click',()=>{
  button.disabled=true;
  button.textContent='A abrir…';
  window.location.assign('/assistant.html');
});
</script>
</body>
</html>
