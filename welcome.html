<style>
:root{
  --blue:#0b6ff5;
  --blue-dark:#0755c7;
  --navy:#0b1f3a;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{
  min-height:100svh;
  color:var(--navy);
  background:
    radial-gradient(circle at 50% 8%,rgba(11,111,245,.10),transparent 35%),
    linear-gradient(180deg,#fbfdff 0%,#f4f8fe 100%);
}
main{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:max(24px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
}
.entry{
  width:min(520px,100%);
  text-align:center;
}
.identity{
  margin:0 0 22px;
  color:var(--blue);
  font-size:15px;
  font-weight:800;
  letter-spacing:.015em;
}
.identity strong{color:var(--navy)}
h1{
  margin:0;
  font-size:clamp(40px,10vw,62px);
  line-height:1.03;
  letter-spacing:-.052em;
  font-weight:900;
}
button{
  width:min(360px,100%);
  min-height:70px;
  margin-top:34px;
  padding:16px 28px;
  border:0;
  border-radius:20px;
  color:#fff;
  background:linear-gradient(135deg,#1685ff,var(--blue) 55%,var(--blue-dark));
  box-shadow:0 16px 30px rgba(8,91,205,.26);
  font:inherit;
  font-size:22px;
  font-weight:900;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 20px 36px rgba(8,91,205,.31);
}
button:active{transform:translateY(1px)}
button:focus-visible{outline:4px solid rgba(11,111,245,.22);outline-offset:5px}
button:disabled{opacity:.72;cursor:wait;transform:none}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main>
  <section class="entry" aria-labelledby="welcomeTitle">
    <p class="identity">Assistente do <strong>Carlos</strong></p>
    <h1 id="welcomeTitle">Vamos dar seguimento ao seu pedido</h1>
    <button id="startAssistant" type="button">Continuar</button>
  </section>
</main>
<script>
const button=document.getElementById('startAssistant');
button.addEventListener('click',()=>{
  button.disabled=true;
  button.textContent='A abrir…';
  window.location.assign('/assistant.html');
});
</script>
</body>
</html>
