  <rect x="877" y="195" width="212" height="212" rx="58" fill="#001124" opacity="0.18"/>
  <g transform="translate(865 181)">
    <rect width="212" height="212" rx="58" fill="url(#icon)"/>
    <rect x="43" y="51" width="126" height="91" rx="28" fill="#ffffff"/>
    <path d="M76 140 58 164 62 132Z" fill="#ffffff"/>
    <circle cx="82" cy="96" r="8" fill="#0b6ff5"/>
    <circle cx="106" cy="96" r="8" fill="#0b6ff5"/>
    <circle cx="130" cy="96" r="8" fill="#0b6ff5"/>
    <circle cx="180" cy="179" r="25" fill="#20c57a" stroke="#ffffff" stroke-width="8"/>
  </g>
