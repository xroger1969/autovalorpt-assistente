name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check server JavaScript
        run: |
          node --check api/chat.js
          node --check api/admin-retomas.js
          node --check api/admin-session.js
          node --check api/photo-gallery.js
          node --check api/photo-session.js
          node --check api/photo-upload-url.js
          node --check api/stock.js
          node --check lib/admin-security.js
          node --check lib/photo-manifest.js
          node --check lib/photo-security.js
      - name: Check browser JavaScript
        run: |
          node --check retomas.js
          node --check vehicle-photos.js
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/gi)].map(match => match[1]);
          if (!scripts.length) throw new Error('No browser script found');
          for (const script of scripts) new Function(script);
          console.log('Browser JavaScript syntax is valid');
          NODE
